name: gatk4_applyvqsr
description: Apply an SNP or INDEL VQSR model to a per-contig cohort VCF
keywords: [gatk4, vqsr, applyvqsr]
tools:
  - gatk4:
      description: Genome Analysis Toolkit
      homepage: https://gatk.broadinstitute.org/
      documentation: https://gatk.broadinstitute.org/hc/en-us/articles/360037225832-ApplyVQSR
      license: BSD-3-Clause
input:
  - meta:
      type: map
      description: Contig metadata containing `contig`
  - vcf:
      type: file
      description: Cohort VCF to recalibrate
  - vcf_index:
      type: file
      description: Tabix index for the cohort VCF
  - recal:
      type: file
      description: VQSR recalibration table
  - recal_index:
      type: file
      description: Index for the recalibration table
  - tranches:
      type: file
      description: VQSR tranche definitions
  - fasta:
      type: file
      description: GRCh38 reference FASTA
  - fai:
      type: file
      description: FASTA index
  - dict:
      type: file
      description: Reference sequence dictionary
  - mode:
      type: string
      description: SNP or INDEL
  - truth_sensitivity:
      type: number
      description: Truth-sensitivity filter level
output:
  - vcf:
      type: tuple
      description: Metadata, recalibrated VCF, and tabix index
      pattern: "*.vqsr.vcf.gz{,.tbi}"
  - versions:
      type: file
      description: Software version record
      pattern: versions.yml
